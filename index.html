<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e1a" />
<title>GameZone 2.0 — L'univers gaming ultime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#05070f;--bg-1:#0a0e1a;--bg-2:#111827;--bg-3:#1a2233;
  --card:#131a2a;--card-hover:#1a2338;
  --border:rgba(120,160,255,.12);--border-hot:rgba(0,229,255,.45);
  --cyan:#00e5ff;--violet:#8b5cf6;--pink:#ff2d95;--lime:#a3ff12;--gold:#ffb800;
  --txt:#eaf0ff;--txt-dim:#93a1c4;--txt-mute:#5b6a8c;
  --grad-1:linear-gradient(135deg,#00e5ff 0%,#8b5cf6 50%,#ff2d95 100%);
  --grad-2:linear-gradient(135deg,#8b5cf6 0%,#ff2d95 100%);
  --shadow-md:0 10px 30px rgba(0,0,0,.45);
  --shadow-glow:0 0 24px rgba(0,229,255,.35);
  --r-sm:10px;--r-md:16px;--r-lg:22px;
  --nav-h:70px;--safe-b:env(safe-area-inset-bottom,0px);
}
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Rajdhani',system-ui,-apple-system,sans-serif;
  background:var(--bg-0);color:var(--txt);min-height:100vh;overflow-x:hidden;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 20px);line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse 80% 60% at 15% 0%,rgba(0,229,255,.14),transparent 60%),
    radial-gradient(ellipse 70% 55% at 90% 10%,rgba(139,92,246,.16),transparent 60%),
    radial-gradient(ellipse 90% 60% at 50% 100%,rgba(255,45,149,.10),transparent 60%),
    var(--bg-0);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:
    linear-gradient(rgba(120,160,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,160,255,.045) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 30%,#000 40%,transparent 85%);
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-1)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--cyan),var(--violet));border-radius:10px}

header{
  position:sticky;top:0;z-index:100;background:rgba(10,14,26,.82);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  border-bottom:1px solid var(--border);padding:14px 18px 10px;
}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{
  display:flex;align-items:center;gap:10px;font-family:'Orbitron',sans-serif;
  font-weight:900;font-size:1.35rem;letter-spacing:.5px;
  background:var(--grad-1);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;text-decoration:none;
}
.logo-icon{
  width:36px;height:36px;border-radius:11px;background:var(--grad-1);
  display:grid;place-items:center;font-size:1.1rem;
  box-shadow:var(--shadow-glow);-webkit-text-fill-color:#fff;
  animation:pulseGlow 3s ease-in-out infinite;
}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 20px rgba(0,229,255,.35)}
  50%{box-shadow:0 0 32px rgba(139,92,246,.55)}
}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{
  width:40px;height:40px;border-radius:12px;background:var(--bg-2);
  border:1px solid var(--border);color:var(--txt);display:grid;
  place-items:center;font-size:1.1rem;cursor:pointer;transition:.25s;position:relative;
}
.icon-btn:hover,.icon-btn:active{background:var(--bg-3);border-color:var(--border-hot);transform:translateY(-2px)}
.fav-count{
  position:absolute;top:-6px;right:-6px;background:var(--grad-2);color:#fff;
  font-size:.62rem;font-weight:700;min-width:18px;height:18px;padding:0 4px;
  border-radius:9px;display:grid;place-items:center;border:2px solid var(--bg-1);
}
.search-wrap{margin-top:12px;position:relative}
.search-wrap input{
  width:100%;padding:12px 44px 12px 42px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:14px;color:var(--txt);
  font-family:inherit;font-size:.95rem;font-weight:500;outline:none;transition:.25s;
}
.search-wrap input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.15);background:var(--bg-3)}
.search-wrap input::placeholder{color:var(--txt-mute)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--txt-mute);font-size:1rem;pointer-events:none}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--txt-mute);font-size:1.1rem;cursor:pointer;padding:4px;display:none}
.search-clear.show{display:block} 
  header{
  position:sticky;top:0;z-index:100;background:rgba(10,14,26,.82);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);

}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 20px rgba(0,229,255,.35)}
  50%{box-shadow:0 0 32px rgba(139,92,246,.55)}
}

}

  font-family:inherit;font-size:.95rem;font-weight:500;outline:none;transition:.25s;
}
.search-wrap input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.15);background:var(--bg-3)}
.search-wrap input::placeholder{color:var(--txt-mute)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--txt-mute);font-size:1rem;pointer-events:none}

.search-clear.show{display:block}

  main{padding:20px 16px 40px;max-width:1200px;margin:0 auto}
.section{margin-bottom:32px;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.section-title{
  font-family:'Orbitron',sans-serif;font-weight:800;font-size:1.05rem;
  letter-spacing:.5px;display:flex;align-items:center;gap:9px;color:var(--txt);
}
.section-title .bar{width:4px;height:22px;border-radius:3px;background:var(--grad-1);box-shadow:var(--shadow-glow)}
.section-badge{
  font-size:.68rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--cyan);padding:4px 10px;border-radius:20px;
  background:rgba(0,229,255,.10);border:1px solid rgba(0,229,255,.25);
}
.hero{
  position:relative;border-radius:var(--r-lg);overflow:hidden;
  background:linear-gradient(135deg,rgba(0,229,255,.14),rgba(139,92,246,.18) 55%,rgba(255,45,149,.14));
  border:1px solid var(--border-hot);padding:26px 22px;margin-bottom:26px;
  box-shadow:var(--shadow-md);
}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(0,229,255,.28),transparent 55%);pointer-events:none}
.hero-tag{
  display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--lime);background:rgba(163,255,18,.12);
  border:1px solid rgba(163,255,18,.3);padding:5px 12px;border-radius:20px;margin-bottom:12px;
}
.hero h1{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.75rem;line-height:1.15;
  margin-bottom:8px;background:var(--grad-1);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent;position:relative;
}
.hero p{color:var(--txt-dim);font-size:.95rem;font-weight:500;position:relative}
.hero-stats{display:flex;gap:18px;margin-top:18px;position:relative;flex-wrap:wrap}
.hero-stat .n{font-family:'Orbitron',sans-serif;font-weight:800;font-size:1.3rem;color:var(--cyan)}
.hero-stat .l{font-size:.7rem;color:var(--txt-mute);letter-spacing:1px;text-transform:uppercase}

.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .hero h1{font-size:2.2rem}
}
@media(min-width:900px){
  .grid-3{grid-template-columns:repeat(4,1fr)}
  main{padding:28px 24px 60px}
}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
  padding:16px;transition:.28s cubic-bezier(.2,.7,.3,1);position:relative;overflow:hidden;cursor:pointer;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad-1);opacity:0;transition:.3s}
.card:hover,.card:active{background:var(--card-hover);border-color:var(--border-hot);transform:translateY(-4px);box-shadow:var(--shadow-md),0 0 20px rgba(0,229,255,.12)}
.card:hover::before,.card:active::before{opacity:1}
.cats{display:flex;gap:9px;overflow-x:auto;padding:4px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{
  flex-shrink:0;display:flex;align-items:center;gap:7px;padding:9px 15px;
  border-radius:30px;background:var(--bg-2);border:1px solid var(--border);
  color:var(--txt-dim);font-size:.83rem;font-weight:600;cursor:pointer;transition:.25s;white-space:nowrap;
}
.cat.active{background:var(--grad-1);color:#fff;border-color:transparent;box-shadow:var(--shadow-glow)}
.cat:active{transform:scale(.96)}

.item{display:flex;flex-direction:column;gap:10px}
.item-thumb{
  width:100%;aspect-ratio:1/1;border-radius:var(--r-sm);background:var(--grad-2);
  display:grid;place-items:center;font-size:2rem;position:relative;overflow:hidden;
}
.item-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.12))}
.item-name{font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.3px;color:var(--txt);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-sub{font-size:.75rem;color:var(--txt-mute);font-weight:500}
.fav-btn{
  position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
  background:rgba(10,14,26,.7);backdrop-filter:blur(8px);border:1px solid var(--border);
  display:grid;place-items:center;font-size:1rem;cursor:pointer;transition:.25s;z-index:2;
}
.fav-btn:hover{transform:scale(1.1);border-color:var(--pink)}
.fav-btn.on{background:rgba(255,45,149,.15);border-color:var(--pink);animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.8)}50%{transform:scale(1.2)}100%{transform:scale(1)}}

.news-list{display:flex;flex-direction:column;gap:12px}
.news-card{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--border);transition:.25s;cursor:pointer}
.news-card:hover,.news-card:active{border-color:var(--border-hot);background:var(--card-hover);transform:translateX(4px)}
.news-icon{width:52px;height:52px;flex-shrink:0;border-radius:12px;background:var(--grad-2);display:grid;place-items:center;font-size:1.4rem}
.news-body{flex:1;min-width:0}
.news-title{font-family:'Orbitron',sans-serif;font-weight:700;font-size:.88rem;margin-bottom:5px;color:var(--txt);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-desc{font-size:.8rem;color:var(--txt-dim);font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-meta{font-size:.68rem;color:var(--txt-mute);margin-top:6px;display:flex;gap:10px;align-items:center;letter-spacing:.5px;text-transform:uppercase}
